<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FamousMai · 日记</title>
  <meta name="description" content="日记与生活复盘" />
  <link rel="stylesheet" href="/assets/site/styles.css" />
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="brand">FamousMai</div>
      <div class="nav-links">
        <a href="/">首页</a>
        <a href="/basketball.html">篮球</a>
        <a href="/coding.html">写代码</a>
        <a class="active" href="/journal.html">日记</a>
        <a href="/ai.html">AI</a>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1>📓 生活日志</h1>
        <p>我喜欢用日记记录情绪、目标和日常的微光。写下来的瞬间，思绪会更清晰。</p>
        <div class="hero-actions">
          <a class="button primary" href="/ai.html">看看 AI 灵感</a>
          <a class="button secondary" href="/">返回首页</a>
        </div>
      </div>
      <div class="hero-card">
        <img src="/assets/site/hero.svg" alt="Journal glow" />
      </div>
    </section>

    <section>
      <h2 class="section-title">日记节奏</h2>
      <div class="grid">
        <div class="card">
          <h3>早晨三件事</h3>
          <p>写下今天最重要的三件小事，明确优先级。</p>
        </div>
        <div class="card">
          <h3>情绪刻度</h3>
          <p>给今天的状态打分，快速识别能量波动。</p>
        </div>
        <div class="card">
          <h3>复盘一句话</h3>
          <p>总结今天最大的收获，让成长更可见。</p>
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-title">灵感池</h2>
      <div class="timeline">
        <div class="timeline-item">记录一句触动我的话。</div>
        <div class="timeline-item">收藏一张照片或一段音乐。</div>
        <div class="timeline-item">写下当天的一个小惊喜。</div>
      </div>
    </section>

    <footer class="footer">日记不是打卡，而是与自己对话</footer>
  </div>
</body>
</html>
