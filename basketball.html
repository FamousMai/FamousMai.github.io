<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FamousMai · 篮球</title>
  <meta name="description" content="篮球训练与比赛复盘" />
  <link rel="stylesheet" href="/assets/site/styles.css" />
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="brand">FamousMai</div>
      <div class="nav-links">
        <a href="/">首页</a>
        <a class="active" href="/basketball.html">篮球</a>
        <a href="/coding.html">写代码</a>
        <a href="/journal.html">日记</a>
        <a href="/ai.html">AI</a>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1>🏀 球场节奏</h1>
        <p>篮球是我最热血的标签。我喜欢用系统化训练提升自己，让每一次上篮都更接近理想状态。</p>
        <div class="hero-actions">
          <a class="button primary" href="/coding.html">看看我的代码</a>
          <a class="button secondary" href="/">返回首页</a>
        </div>
      </div>
      <div class="hero-card">
        <img src="/assets/site/hero.svg" alt="Basketball energy" />
      </div>
    </section>

    <section>
      <h2 class="section-title">训练清单</h2>
      <div class="grid">
        <div class="card">
          <h3>爆发力</h3>
          <p>折返跑、冲刺、跳箱，提升第一步启动速度。</p>
        </div>
        <div class="card">
          <h3>手感</h3>
          <p>三分 + 罚球 + 低位脚步，保证投篮稳定性。</p>
        </div>
        <div class="card">
          <h3>体能</h3>
          <p>20 分钟 HIIT + 拉伸恢复，保持比赛状态。</p>
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-title">赛后复盘</h2>
      <div class="timeline">
        <div class="timeline-item">最舒服的进攻方式是什么？</div>
        <div class="timeline-item">防守是否有盯人漏掉的瞬间？</div>
        <div class="timeline-item">下一场想尝试的新动作？</div>
      </div>
    </section>

    <footer class="footer">持续训练 · 持续热爱</footer>
  </div>
</body>
</html>
